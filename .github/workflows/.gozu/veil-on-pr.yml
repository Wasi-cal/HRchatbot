# Starts the veil workflow on the branch of a pull request.
# veil refuses the pull_request event, so this workflow only dispatches it.
# It holds no secrets, and it skips PRs from forks.
name: veil-on-pr

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  actions: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Run veil on the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run veil.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
