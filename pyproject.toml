[project]
name = "hrchatbot"
version = "0.1.0"
description = "HR RAG chatbot - document ingestion, chunking, embedding, and vector store pipeline"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pytesseract>=0.3.10",
    "pillow>=13.0.0",  # Fix JPEG encoding and unsafe WMF and EMF rendering.
    "img2table>=1.3",
    "numpy>=1.24",
    "pandas>=2.0",
    # --- vector store / embedding layer ---
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "python-dotenv>=1.0",
    "flagembedding>=1.3",
    # --- generation layer ---
    "openai>=1.50",
    # --- serving layer (api/) ---
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # --- runtime config cache ---
    "redis>=5.0",
    "httpx>=0.28.1",
    "aiohttp==3.14.4",
    "multidict>=6.9.1",
    "certifi>=2026.10.19",
    "filelock>=4.2.1",
    "opentelemetry-api>=1.45.1",
]

[tool.uv]
package = false
required-version = ">=0.9.17"
# Allow time to detect malicious or unstable releases before resolution.
exclude-newer = "7 days"

[dependency-groups]
voice-test = [
    "deepgram-sdk>=7.12.0",
    "sounddevice>=0.5.6",
]
