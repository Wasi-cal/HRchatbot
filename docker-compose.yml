services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hrchatbot-vectorstore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-hrchatbot}
      POSTGRES_USER: ${PGUSER:-hrchatbot}
      POSTGRES_PASSWORD: ${PGPASSWORD:-hrchatbot}
    ports:
      - "${PGPORT:-5434}:5432"
    volumes:
      - hrchatbot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-hrchatbot} -d ${PGDATABASE:-hrchatbot}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hrchatbot_pgdata:
